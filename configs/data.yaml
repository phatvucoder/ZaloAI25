# ZaloAI25 YOLO Dataset Configuration

paths:
  train_data: "dataset/raw/train"     # Raw training data
  target_dir: "dataset"               # Output directory
  target_name: "yolo_dataset"         # Dataset name
  target_subset_dir: "dataset/subset" # Subset output directory
  target_subset_name: "yolo_dataset"  # Subset dataset name
  split_dir: "dataset/yolo_dataset"   # Source dataset directory for splitting

files:
  video_ext: ["mp4", "avi", "mov"]   # Supported video formats
  image_ext: ["jpg"]                 # Output image formats

video:
  extraction_mode: "all"             # legacy - backward compatibility
                                     # all - every frame from video
                                     # annotated_only - only frames with annotations
                                     # hybrid - different FPS for annotated vs empty frames
                                     # non_annotated_only - only empty frames (no annotations)
  hybrid_fps:
    enabled: false                   # Enable hybrid FPS
    annotated_fps: null              # FPS for annotated frames (null=original, 0=none)
    non_annotated_fps: 3             # FPS for empty frames (0=none)
    ensure_annotated_frames: true    # Never skip annotated frames

class_mapping:
  # Map original class names from video IDs to standardized YOLO format
  Backpack: {new_id: 0, new_name: "backpack"}
  Jacket: {new_id: 1, new_name: "jacket"}
  Laptop: {new_id: 2, new_name: "laptop"}
  Lifering: {new_id: 3, new_name: "lifering"}
  MobilePhone: {new_id: 4, new_name: "mobile_phone"}
  Person1: {new_id: 5, new_name: "person"}
  WaterBottle: {new_id: 6, new_name: "water_bottle"}

processing:
  copy_object_images: true           # Copy reference object images to dataset

normal_mode:
  sequential_processing: true        # Process videos one by one
  io_threading: true                 # Use threading for file I/O
  max_io_threads: 4                  # Maximum I/O threads

turbo_mode:
  parallel_processing: true          # Process multiple videos simultaneously
  max_workers: null                  # Worker count (null = auto-detect CPU count)
  use_threading: true                # Use ThreadPool instead of ProcessPool
  batch_processing: true             # Process frames in batches
  batch_size: 32                     # Frames per batch
  memory_efficient: true             # Enable memory optimizations
  use_numpy: true                    # Use NumPy for faster calculations
  vectorized_conversion: true        # Vectorize coordinate conversion
  dtype: "float32"                   # NumPy data type
  concurrent_file_operations: true   # Parallel file operations
  max_file_workers: 8                # File operation workers
  buffer_size: 8192                  # I/O buffer size
  memory_mapping: false              # Use memory mapping for large files
  gc_frequency: 100                  # Garbage collection frequency
  prefetch_frames: true              # Prefetch video frames
  prefetch_buffer_size: 16           # Prefetch buffer size
  async_writes: true                 # Asynchronous file writes
  write_batch_size: 64               # Write batch size
  print_sub_tqdm: false              # Show detailed progress bars